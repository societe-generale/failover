# Parallelize across top-level test classes so distinct Spring contexts (many @TestPropertySource
# combos across FailoverAutoConfigurationTest, FailoverStoreAutoConfigurationTest, etc.) start
# concurrently instead of serially. Methods/@Nested classes within one top-level class stay on the
# same thread: they share one context/bean instance and aren't written for concurrent access.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
